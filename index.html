<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://appssdk.zoom.us; connect-src 'self' https://appssdk.zoom.us; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self' https://*.zoom.us https://*.zoomdev.us https://*.zoom.com;"
    />
    <title>IWS Arbeitsblätter – In Würde zu sich stehen</title>
    <meta
      name="description"
      content="Digitale, lokal gespeicherte Arbeitsblätter zum IWS-Programm In Würde zu sich stehen."
    />
        <script>
      (function () {
        function applySize() {
          var h = window.innerHeight || document.documentElement.clientHeight || 640
          if (h < 80) h = 640
          document.documentElement.style.setProperty('--app-h', h + 'px')
        }
        applySize()
        window.addEventListener('resize', applySize)
        if (/ZoomWebKit|ZoomApps/i.test(navigator.userAgent || '')) {
          document.documentElement.classList.add('in-zoom')
        }
      })()
    </script>
    <script>
      (function () {
        function configure() {
          var sdk = window.zoomSdk
          if (!sdk || typeof sdk.config !== 'function') return
          window.__zoomConfigPromise = sdk.config({
            version: '0.16',
            capabilities: [
              'shareApp', 'getRunningContext', 'getUserContext', 'getMeetingContext',
              'getMeetingUUID', 'postMessage', 'onMessage', 'expandApp', 'openUrl', 'getSupportedJsApis',
            ],
            popoutSize: { width: 960, height: 640 },
          })
        }
        if (window.zoomSdk) { configure(); return }
        var s = document.createElement('script')
        s.src = 'https://appssdk.zoom.us/sdk.min.js'
        s.onload = configure
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://appssdk.zoom.us/sdk.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
